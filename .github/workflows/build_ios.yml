name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd teacher_app
          flutter pub get

      - name: Build iOS App (Unsigned)
        run: |
          cd teacher_app
          flutter build ios --no-codesign

      - name: Package Unsigned .IPA File
        run: |
          cd teacher_app
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r GSMS_Teacher_App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSMS_Teacher_App_IPA
          path: teacher_app/build/ios/ipa/GSMS_Teacher_App.ipa

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "GSMS Teacher Companion (Latest IPA)"
          body: "Updated iOS build with modern vertical attendance bar graph UI."
          files: teacher_app/build/ios/ipa/GSMS_Teacher_App.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

