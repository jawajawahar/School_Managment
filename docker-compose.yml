# Whole system (PostgreSQL + API + web portal) in one command:
#
#   docker compose up -d --build
#
# then open http://localhost:8080  (login: principal@school.edu / ChangeMe123!)
# The database schema, curriculum subjects and the principal account are
# created automatically on first start.
#
# To update after pulling new code, run the same command again.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gsms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - gsms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gsms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-postgres}@db:5432/gsms_db
      PORT: 5000
      WHATSAPP_AUTOSTART: ${WHATSAPP_AUTOSTART:-true}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
    ports:
      - "${APP_PORT:-8080}:5000"
    volumes:
      # Keeps the linked WhatsApp session across restarts and rebuilds
      - gsms_whatsapp:/app/server/baileys_auth_info

volumes:
  gsms_pgdata:
  gsms_whatsapp:
